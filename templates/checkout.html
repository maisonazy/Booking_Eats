{% extends "base.html" %}
{% block title %}Checkout | Festove Eats{% endblock %}

{% block content %}
<section class="checkout-page">
    <div class="checkout-card">
        <h1>Checkout</h1>
        <p>Enter your contact details to place your order.</p>

        {% if errors %}
        <ul class="checkout-errors" role="alert">
            {% for error in errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
        {% endif %}

        <div class="checkout-summary" id="checkout-summary" aria-live="polite"></div>

        <form method="post" class="checkout-form">
            {% csrf_token %}
            <input type="hidden" name="cart_data" id="cart-data">
            <label for="customer-name">Name</label>
            <input id="customer-name" name="name" type="text" maxlength="120" required value="{{ request.POST.name|default:'' }}">

            <label for="customer-email">Email</label>
            <input id="customer-email" name="email" type="email" required value="{{ request.POST.email|default:'' }}">

            <label for="customer-phone">Phone</label>
            <input id="customer-phone" name="phone" type="tel" maxlength="30" required value="{{ request.POST.phone|default:'' }}">

            <button class="btn" type="submit">Place order</button>
        </form>
    </div>
</section>
{% endblock %}
